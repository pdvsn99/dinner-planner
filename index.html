<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinner Planner</title>
  <meta name="description" content="Plan the week's dinners, roll the dice on meals, treat yourself, mark days out, and get an automatic shopping list." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">🍽️</span>
        <div>
          <h1>Dinner Planner</h1>
          <p class="tagline">Roll the week, treat yourself, shop smart.</p>
        </div>
      </div>
      <div id="account" class="account" hidden>
        <span id="account-email" class="account-email"></span>
        <button id="btn-signout" class="btn btn-ghost btn-sm">Sign out</button>
      </div>
    </div>
  </header>

  <!-- ===== Loading ===== -->
  <div id="view-loading" class="wrap center-view">
    <p class="muted">Loading…</p>
  </div>

  <!-- ===== Sign-in ===== -->
  <main id="view-auth" class="wrap center-view" hidden>
    <div class="card auth-card">
      <h2>Sign in</h2>
      <p class="muted">Enter your email and we'll send you a one-tap login link. No password to remember.</p>
      <form id="auth-form">
        <input id="auth-email" class="select" type="email" placeholder="you@example.com" autocomplete="email" required />
        <button class="btn btn-primary" type="submit" id="auth-submit">Send login link</button>
      </form>
      <p id="auth-msg" class="auth-msg" hidden></p>
    </div>
  </main>

  <!-- ===== App ===== -->
  <main id="view-app" class="wrap" hidden>
    <nav class="tabs">
      <button class="tab is-active" data-tab="planner">📅 Planner</button>
      <button class="tab" data-tab="shopping">🛒 Shopping</button>
      <button class="tab" data-tab="meals">🍲 Meals</button>
    </nav>

    <!-- ---- Planner tab ---- -->
    <section id="tab-planner" class="tab-panel">
      <div class="week-nav">
        <button id="week-prev" class="btn btn-ghost" aria-label="Previous week">‹</button>
        <div class="week-label">
          <strong id="week-title">This week</strong>
          <button id="week-today" class="link-btn">Go to this week</button>
        </div>
        <button id="week-next" class="btn btn-ghost" aria-label="Next week">›</button>
      </div>

      <div id="grid-body" class="week-list" aria-label="Weekly dinner plan"></div>
    </section>

    <!-- ---- Shopping tab ---- -->
    <section id="tab-shopping" class="tab-panel" hidden>
      <div class="card shopping">
        <div class="shopping-head">
          <h2>🛒 Shopping list</h2>
          <span id="shopping-count" class="count"></span>
        </div>
        <div id="shopping-body" class="shopping-body"></div>
      </div>
      <p class="foot"><button id="btn-print" class="link-btn">🖨️ Print this list</button></p>
    </section>

    <!-- ---- Meals tab ---- -->
    <section id="tab-meals" class="tab-panel" hidden>
      <div class="meals-head">
        <h2>Your meals</h2>
        <button id="btn-add-meal" class="btn btn-primary">＋ Add meal</button>
      </div>
      <div id="meals-list" class="meals-list"></div>
    </section>
  </main>

  <!-- ===== Bottom action bar (Planner) ===== -->
  <div id="action-bar" class="action-bar" hidden>
    <div class="wrap action-bar-inner">
      <!-- Default: whole-week actions -->
      <div id="bar-week" class="bar-group">
        <button id="btn-generate" class="bar-btn is-primary">
          <span class="bar-ico">🎲</span><span class="bar-lbl">Generate</span>
        </button>
        <button id="btn-treat-week" class="bar-btn is-treat">
          <span class="bar-ico">🎉</span><span class="bar-lbl">Treat week</span>
        </button>
        <button id="btn-clear" class="bar-btn">
          <span class="bar-ico">🧹</span><span class="bar-lbl">Clear</span>
        </button>
      </div>

      <!-- When a day is selected: that day's actions -->
      <div id="bar-day" class="bar-group" hidden>
        <button id="bar-deselect" class="bar-btn bar-back" aria-label="Deselect day">
          <span class="bar-ico">‹</span>
        </button>
        <span id="bar-day-label" class="bar-day-label"></span>
        <button id="btn-swap" class="bar-btn">
          <span class="bar-ico">🔀</span><span class="bar-lbl">Swap</span>
        </button>
        <button id="btn-treat-cell" class="bar-btn is-treat">
          <span class="bar-ico">✨</span><span class="bar-lbl">Treat</span>
        </button>
        <button id="btn-edit" class="bar-btn is-primary">
          <span class="bar-ico">✏️</span><span class="bar-lbl">Edit</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Meal picker ===== -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Choose a meal</h2>
        <button id="modal-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="pick-search">Meal</label>
        <div id="pick-combo" class="combo">
          <input type="hidden" id="pick-meal" />
          <input id="pick-search" class="select combo-input" type="text"
                 placeholder="Search meals…" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="pick-list" />
          <div id="pick-list" class="combo-list" role="listbox" hidden></div>
        </div>
        <div id="pick-sides-wrap" class="sides-wrap">
          <div class="field-label">Sides <span id="pick-hint" class="hint-inline"></span></div>
          <div id="pick-sides" class="sides"></div>
        </div>
        <div class="quick-row">
          <button id="pick-random" class="btn btn-ghost">🎲 Random</button>
          <button id="pick-treat" class="btn btn-ghost">✨ Treat</button>
          <button id="pick-out" class="btn btn-ghost">🚫 Mark out</button>
          <button id="pick-clear" class="btn btn-ghost">🧹 Clear this cell</button>
        </div>
      </div>
      <div class="modal-foot">
        <button id="pick-cancel" class="btn btn-ghost">Cancel</button>
        <button id="pick-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== Meal editor ===== -->
  <div id="meal-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="meal-modal-title">
      <div class="modal-head">
        <h2 id="meal-modal-title">Add meal</h2>
        <button id="meal-modal-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="m-name">Name</label>
        <input id="m-name" class="select" type="text" placeholder="e.g. Meatballs" />

        <label class="field-label" for="m-location">Where</label>
        <select id="m-location" class="select">
          <option value="Home">Home (cooked)</option>
          <option value="Takeaway">Takeaway (treat)</option>
          <option value="Eating Out">Eating Out (treat)</option>
        </select>

        <label class="field-label" for="m-sides">Sides it can have <span class="hint-inline">(comma separated)</span></label>
        <input id="m-sides" class="select" type="text" placeholder="mash, gravy, peas, wedges" />

        <div class="grid-2">
          <div>
            <label class="field-label" for="m-min">Fewest sides</label>
            <input id="m-min" class="select" type="number" min="0" value="0" />
          </div>
          <div>
            <label class="field-label" for="m-max">Most sides</label>
            <input id="m-max" class="select" type="number" min="0" value="0" />
          </div>
        </div>

        <div class="field-label">Allowed on</div>
        <div id="m-days" class="sides"></div>

        <label class="field-label" for="m-ingredients">Shopping items <span class="hint-inline">(comma separated)</span></label>
        <input id="m-ingredients" class="select" type="text" placeholder="meatballs, gravy" />
      </div>
      <div class="modal-foot">
        <button id="meal-delete" class="btn btn-ghost danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button id="meal-cancel" class="btn btn-ghost">Cancel</button>
        <button id="meal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="meals.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
